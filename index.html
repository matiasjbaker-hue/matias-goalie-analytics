<script>
/* =========================================================
   REBOUND CONTROL
   Source table: goalierebound_control
   Season: 2026 preseason
   ========================================================= */

const CONTROL_TABLE = "goalierebound_control";
const CONTROL_SEASON = "2026 preseason";

/* ---------------------------------------------------------
   Fetch rebound-control data
   --------------------------------------------------------- */

async function fetchReboundControlData() {
  try {
    const [gamesResponse, controlResponse] = await Promise.all([
      fetch(
        `${SUPABASE_URL}/rest/v1/Games?select=*`,
        {
          headers: SUPABASE_HEADERS
        }
      ),
      fetch(
        `${SUPABASE_URL}/rest/v1/${CONTROL_TABLE}?select=*`,
        {
          headers: SUPABASE_HEADERS
        }
      )
    ]);

    if (!gamesResponse.ok) {
      throw new Error("Could not load Games table.");
    }

    if (!controlResponse.ok) {
      throw new Error("Could not load goalierebound_control table.");
    }

    const games = await gamesResponse.json();
    const controls = await controlResponse.json();

    console.log("CONTROL - Games:", games);
    console.log("CONTROL - Rebound Control:", controls);

    /*
      Find the games belonging to 2026 preseason.

      This checks common possible season column names so the
      Control tab doesn't break if your Games table uses
      slightly different capitalization.
    */

    const seasonGames = games.filter(game => {
      const season =
        game.season ??
        game.Season ??
        game.SEASON ??
        "";

      return String(season).trim().toLowerCase() ===
        CONTROL_SEASON.toLowerCase();
    });

    const seasonGameIds = new Set(
      seasonGames.map(game => String(game.id))
    );

    /*
      Keep only rebound-control rows belonging to
      2026 preseason games.
    */

    const filteredControls = controls.filter(row => {
      return seasonGameIds.has(String(row.game_id));
    });

    console.log(
      "CONTROL - 2026 preseason games:",
      seasonGames
    );

    console.log(
      "CONTROL - Filtered control rows:",
      filteredControls
    );

    return {
      games: seasonGames,
      controls: filteredControls
    };

  } catch (error) {
    console.error("Rebound control error:", error);

    return {
      games: [],
      controls: []
    };
  }
}


/* ---------------------------------------------------------
   Convert database values to booleans safely
   --------------------------------------------------------- */

function controlValue(value) {

  if (
    value === true ||
    value === 1 ||
    value === "1" ||
    String(value).toLowerCase() === "true" ||
    String(value).toLowerCase() === "yes" ||
    String(value).toLowerCase() === "good"
  ) {
    return true;
  }

  return false;
}


/* ---------------------------------------------------------
   Count a control column
   --------------------------------------------------------- */

function countControlRows(rows, column) {

  return rows.reduce((total, row) => {

    const value = row[column];

    /*
      Supports both:
      true / false
      1 / 0
      "true" / "false"
      "yes" / "no"
      numeric counts
    */

    if (typeof value === "number") {
      return total + value;
    }

    return total + (controlValue(value) ? 1 : 0);

  }, 0);
}


/* ---------------------------------------------------------
   Build Control statistics
   --------------------------------------------------------- */

function calculateControlStats(rows) {

  const stats = {

    gloveGood: 0,
    gloveBad: 0,
    gloveGoals: 0,

    blockerGood: 0,
    blockerBad: 0,
    blockerGoals: 0,

    bodyGood: 0,
    bodyBad: 0,
    bodyGoals: 0,

    padStickGood: 0,
    padStickBad: 0,
    padStickGoals: 0

  };


  /* Glove */

  stats.gloveGood =
    countControlRows(rows, "glove_caught");

  stats.gloveBad =
    countControlRows(rows, "glove_rebound");

  stats.gloveGoals =
    countControlRows(rows, "glove_goal");


  /* Blocker */

  stats.blockerGood =
    countControlRows(rows, "blocker_good");

  stats.blockerBad =
    countControlRows(rows, "blocker_bad");

  stats.blockerGoals =
    countControlRows(rows, "blocker_goal");


  /* Body */

  stats.bodyGood =
    countControlRows(rows, "midsection_good");

  stats.bodyBad =
    countControlRows(rows, "midsection_bad");

  stats.bodyGoals =
    countControlRows(rows, "midsection_goal");


  /* Pad / Stick */

  stats.padStickGood =
    countControlRows(rows, "pad_stick_good");

  stats.padStickBad =
    countControlRows(rows, "pad_stick_bad");

  stats.padStickGoals =
    countControlRows(rows, "pad_stick_goal");


  /* Totals */

  stats.good =
    stats.gloveGood +
    stats.blockerGood +
    stats.bodyGood +
    stats.padStickGood;

  stats.bad =
    stats.gloveBad +
    stats.blockerBad +
    stats.bodyBad +
    stats.padStickBad;

  stats.goals =
    stats.gloveGoals +
    stats.blockerGoals +
    stats.bodyGoals +
    stats.padStickGoals;

  stats.total =
    stats.good +
    stats.bad;


  stats.goodPct =
    stats.total > 0
      ? (stats.good / stats.total) * 100
      : 0;

  stats.badPct =
    stats.total > 0
      ? (stats.bad / stats.total) * 100
      : 0;


  return stats;
}


/* ---------------------------------------------------------
   Render Control tab
   --------------------------------------------------------- */

async function renderControl() {

  const container = document.getElementById("controlContent");

  if (!container) {
    console.error(
      'Missing element: <div id="controlContent"></div>'
    );
    return;
  }


  container.innerHTML = `
    <div class="section">
      <h2>Rebound Control</h2>
      <p class="muted">
        2026 preseason rebound-control analysis
      </p>
    </div>

    <div id="controlLoading" class="section">
      Loading rebound-control data...
    </div>
  `;


  const data = await fetchReboundControlData();

  const rows = data.controls;

  if (!rows.length) {

    container.innerHTML = `
      <div class="section">
        <h2>Rebound Control</h2>

        <div class="empty-state">
          <h3>No rebound-control data found</h3>

          <p>
            No rows from
            <strong>goalierebound_control</strong>
            were connected to games from
            <strong>2026 preseason</strong>.
          </p>

          <p class="muted">
            Check the browser console for the raw Games and
            rebound-control data.
          </p>
        </div>
      </div>
    `;

    return;
  }


  const stats = calculateControlStats(rows);


  /* -------------------------------------------------------
     Directional rows
     ------------------------------------------------------- */

  const directions = [
    {
      name: "Glove",
      good: stats.gloveGood,
      bad: stats.gloveBad,
      goals: stats.gloveGoals
    },
    {
      name: "Blocker",
      good: stats.blockerGood,
      bad: stats.blockerBad,
      goals: stats.blockerGoals
    },
    {
      name: "Body",
      good: stats.bodyGood,
      bad: stats.bodyBad,
      goals: stats.bodyGoals
    },
    {
      name: "Pad / Stick",
      good: stats.padStickGood,
      bad: stats.padStickBad,
      goals: stats.padStickGoals
    }
  ];


  /* -------------------------------------------------------
     Main HTML
     ------------------------------------------------------- */

  container.innerHTML = `

    <div class="section">

      <h2>Rebound Control</h2>

      <p class="muted">
        2026 preseason
      </p>

      <div class="cards">

        ${card(
          "Good Rebounds",
          stats.good
        )}

        ${card(
          "Bad Rebounds",
          stats.bad
        )}

        ${card(
          "Good Rebound %",
          stats.goodPct.toFixed(1) + "%"
        )}

        ${card(
          "Bad Rebound %",
          stats.badPct.toFixed(1) + "%"
        )}

        ${card(
          "Total Control Events",
          stats.total
        )}

        ${card(
          "Goals After Control Events",
          stats.goals
        )}

      </div>

    </div>


    <div class="section">

      <h2>Good vs Bad Rebounds</h2>

      <div class="chart-box">
        <canvas id="goodBadReboundChart"></canvas>
      </div>

    </div>


    <div class="section">

      <h2>Rebound Control by Direction</h2>

      <div class="chart-box">
        <canvas id="directionControlChart"></canvas>
      </div>

    </div>


    <div class="section">

      <h2>Directional Breakdown</h2>

      <div class="table-wrap">

        <table>

          <thead>

            <tr>
              <th>Direction</th>
              <th>Good</th>
              <th>Bad</th>
              <th>Total</th>
              <th>Good %</th>
              <th>Goals</th>
            </tr>

          </thead>

          <tbody>

            ${directions.map(d => {

              const total =
                d.good + d.bad;

              const goodPct =
                total > 0
                  ? (d.good / total) * 100
                  : 0;

              return `
                <tr>

                  <td>
                    <strong>${d.name}</strong>
                  </td>

                  <td>
                    ${d.good}
                  </td>

                  <td>
                    ${d.bad}
                  </td>

                  <td>
                    ${total}
                  </td>

                  <td>
                    ${goodPct.toFixed(1)}%
                  </td>

                  <td>
                    ${d.goals}
                  </td>

                </tr>
              `;

            }).join("")}

          </tbody>

        </table>

      </div>

    </div>


    <div class="section">

      <h2>Control Efficiency</h2>

      <div class="cards">

        ${directions.map(d => {

          const total =
            d.good + d.bad;

          const percentage =
            total > 0
              ? (d.good / total) * 100
              : 0;

          return card(
            d.name,
            percentage.toFixed(1) + "%"
          );

        }).join("")}

      </div>

    </div>

  `;


  /* -------------------------------------------------------
     Good vs Bad chart
     ------------------------------------------------------- */

  makeChart(
    "goodBadReboundChart",
    {
      type: "bar",

      data: {

        labels: [
          "Good Rebounds",
          "Bad Rebounds"
        ],

        datasets: [
          {
            label: "Rebound Control Events",

            data: [
              stats.good,
              stats.bad
            ],

            borderWidth: 1
          }
        ]

      },

      options: {
        ...chartOptions(),

        scales: {

          y: {
            beginAtZero: true,
            ticks: {
              precision: 0
            }
          }

        }

      }

    }
  );


  /* -------------------------------------------------------
     Direction chart
     ------------------------------------------------------- */

  makeChart(
    "directionControlChart",
    {
      type: "bar",

      data: {

        labels: [
          "Glove",
          "Blocker",
          "Body",
          "Pad / Stick"
        ],

        datasets: [

          {
            label: "Good",

            data: [
              stats.gloveGood,
              stats.blockerGood,
              stats.bodyGood,
              stats.padStickGood
            ],

            borderWidth: 1
          },

          {
            label: "Bad",

            data: [
              stats.gloveBad,
              stats.blockerBad,
              stats.bodyBad,
              stats.padStickBad
            ],

            borderWidth: 1
          }

        ]

      },

      options: {
        ...chartOptions(),

        scales: {

          y: {
            beginAtZero: true,
            ticks: {
              precision: 0
            }
          }

        }

      }

    }
  );

}


/* ---------------------------------------------------------
   Make sure Control renders when selected
   --------------------------------------------------------- */

async function loadControlTab() {

  try {
    await renderControl();

  } catch (error) {

    console.error(
      "Control tab failed:",
      error
    );

  }

}
</script>
