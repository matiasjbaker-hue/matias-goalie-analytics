<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Goalie Analytics</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#061710;--card:#0c261c;--border:#1d4434;--border2:#285640;--text:#edf7f1;--muted:#88a599;--green:#69dda0;--green2:#9be1bd;--red:#ff8585}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 0%,rgba(105,221,160,.1),transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.shell{width:100%;max-width:430px}.brand{text-align:center;margin-bottom:28px}.mark{width:64px;height:64px;border-radius:18px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,var(--green),#3cae75);color:#04110b;font-size:26px;font-weight:900}h1{margin:0;font-size:28px}.brand p{margin:8px 0 0;color:var(--muted);font-size:14px}.card{background:rgba(12,38,28,.95);border:1px solid var(--border);border-radius:20px;padding:28px;box-shadow:0 10px 30px #0003}h2{margin:0 0 8px;font-size:22px}.subtitle{margin:0 0 24px;color:var(--muted);font-size:14px;line-height:1.5}.field{margin-bottom:16px}.field label{display:block;margin-bottom:7px;font-size:13px;color:var(--green2);font-weight:700}input{width:100%;border:1px solid var(--border2);background:#071a12;color:var(--text);border-radius:10px;padding:12px 13px;outline:none;font:inherit}button{font:inherit;cursor:pointer}.primary{width:100%;border:0;border-radius:10px;padding:13px 16px;background:var(--green);color:#06130d;font-weight:900;margin-top:4px}.primary:disabled{opacity:.65;cursor:wait}.links{display:flex;justify-content:space-between;margin-top:16px}.link{border:0;padding:0;background:none;color:var(--green2);font-size:13px}.message{display:none;padding:11px 13px;border-radius:9px;margin-bottom:16px;font-size:13px;line-height:1.45}.message.show{display:block}.error{background:#ff858514;border:1px solid #ff858540;color:#ffb0b0}.success{background:#69dda014;border:1px solid #69dda040;color:var(--green2)}.hidden{display:none!important}
</style>
</head>
<body>
<div class="shell">
<div class="brand"><div class="mark">GA</div><h1>Goalie Analytics</h1><p>Goaltending Analytics Platform</p></div>
<div class="card">
<div id="loginView">
<h2>Sign in</h2><p class="subtitle">Sign in to access your goalie analytics dashboard.</p>
<div id="loginMessage" class="message"></div>
<div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Your password"></div>
<button id="loginButton" class="primary" type="button" onclick="login()">Sign In</button>
<div class="links"><button class="link" type="button" onclick="showView('signupView')">Create account</button><button class="link" type="button" onclick="showView('forgotView')">Forgot password?</button></div>
</div>
<div id="signupView" class="hidden">
<h2>Create account</h2><p class="subtitle">Create an account for a goalie analytics profile.</p><div id="signupMessage" class="message"></div>
<div class="field"><label for="name">Name</label><input id="name" type="text" placeholder="Full name"></div>
<div class="field"><label for="signupEmail">Email</label><input id="signupEmail" type="email" placeholder="you@example.com"></div>
<div class="field"><label for="signupPassword">Password</label><input id="signupPassword" type="password" placeholder="At least 6 characters"></div>
<button id="signupButton" class="primary" type="button" onclick="signup()">Create Account</button><div class="links"><button class="link" type="button" onclick="showView('loginView')">Back to Sign In</button></div>
</div>
<div id="forgotView" class="hidden">
<h2>Reset password</h2><p class="subtitle">Enter your email and we'll send you a password reset link.</p><div id="forgotMessage" class="message"></div>
<div class="field"><label for="forgotEmail">Email</label><input id="forgotEmail" type="email" placeholder="you@example.com"></div>
<button id="forgotButton" class="primary" type="button" onclick="resetPassword()">Send Reset Link</button><div class="links"><button class="link" type="button" onclick="showView('loginView')">Back to Sign In</button></div>
</div>
</div></div>
<script>
const SUPABASE_URL='https://iiuqxxrrruvwvfehrzic.supabase.co';
const SUPABASE_KEY='sb_publishable_b8r2Nb1BWv4cndNyE75dA_o40__ZPQ';
let client=null;
function el(id){return document.getElementById(id)}
function showMessage(id,text,type='error'){const e=el(id);e.textContent=text;e.className='message show '+type}
function clearMessages(){document.querySelectorAll('.message').forEach(e=>{e.textContent='';e.className='message'})}
function showView(id){['loginView','signupView','forgotView'].forEach(v=>el(v).classList.add('hidden'));el(id).classList.remove('hidden');clearMessages()}
function login(){
 const email=el('email').value.trim();
 const password=el('password').value;
 if(!email||!password){showMessage('loginMessage','Please enter your email and password.');return}
 if(!client){showMessage('loginMessage','Login system is still loading. Please refresh the page and try again.');return}
 const b=el('loginButton');b.disabled=true;b.textContent='Signing in...';
 client.auth.signInWithPassword({email,password}).then(function(result){
   if(result.error)throw result.error;
   if(result.data&&result.data.session){window.location.href='/dashboard.html';return}
   throw new Error('Login succeeded but no session was returned.');
 }).catch(function(error){showMessage('loginMessage',error.message||'Unable to sign in.');b.disabled=false;b.textContent='Sign In'});
}
function signup(){
 const name=el('name').value.trim(),email=el('signupEmail').value.trim(),password=el('signupPassword').value;
 if(!name||!email||!password){showMessage('signupMessage','Please complete all fields.');return}
 if(password.length<6){showMessage('signupMessage','Password must be at least 6 characters.');return}
 if(!client){showMessage('signupMessage','Login system is still loading. Please refresh the page and try again.');return}
 const b=el('signupButton');b.disabled=true;b.textContent='Creating...';
 client.auth.signUp({email,password,options:{data:{full_name:name}}}).then(function(result){
   if(result.error)throw result.error;
   if(result.data&&result.data.session){window.location.href='/dashboard.html';return}
   showMessage('signupMessage','Account created. Check your email to confirm your account before signing in.','success');b.disabled=false;b.textContent='Create Account';
 }).catch(function(error){showMessage('signupMessage',error.message||'Unable to create account.');b.disabled=false;b.textContent='Create Account'});
}
function resetPassword(){
 const email=el('forgotEmail').value.trim();
 if(!email){showMessage('forgotMessage','Please enter your email.');return}
 if(!client){showMessage('forgotMessage','Login system is still loading. Please refresh the page and try again.');return}
 const b=el('forgotButton');b.disabled=true;b.textContent='Sending...';
 client.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+'/dashboard.html'}).then(function(result){
   if(result.error)throw result.error;
   showMessage('forgotMessage','Password reset instructions have been sent to your email.','success');b.disabled=false;b.textContent='Send Reset Link';
 }).catch(function(error){showMessage('forgotMessage',error.message||'Unable to send reset link.');b.disabled=false;b.textContent='Send Reset Link'});
}
window.addEventListener('load',function(){
 if(window.supabase&&window.supabase.createClient){
   client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
   client.auth.getSession().then(function(result){if(result.data&&result.data.session)window.location.href='/dashboard.html'}).catch(function(){});
 }else{
   showMessage('loginMessage','Login system failed to load. Please refresh the page.');
 }
});
</script>
</body>
</html>
