<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goalie Analytics</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#061710;--card:#0c261c;--border:#1d4434;--border2:#285640;--text:#edf7f1;--muted:#88a599;--green:#69dda0;--green2:#9be1bd;--red:#ff8585}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 0%,rgba(105,221,160,.10),transparent 35%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .shell{width:100%;max-width:430px}
    .brand{text-align:center;margin-bottom:28px}
    .mark{width:64px;height:64px;border-radius:18px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,var(--green),#3cae75);color:#04110b;font-size:26px;font-weight:900}
    h1{margin:0;font-size:28px;letter-spacing:-.7px}
    .brand p{margin:8px 0 0;color:var(--muted);font-size:14px}
    .card{background:rgba(12,38,28,.95);border:1px solid var(--border);border-radius:20px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
    h2{margin:0 0 8px;font-size:22px}
    .subtitle{margin:0 0 24px;color:var(--muted);font-size:14px;line-height:1.5}
    .field{margin-bottom:16px}.field label{display:block;margin-bottom:7px;font-size:13px;color:var(--green2);font-weight:700}
    input{width:100%;border:1px solid var(--border2);background:#071a12;color:var(--text);border-radius:10px;padding:12px 13px;outline:none;font:inherit}
    input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(105,221,160,.08)}
    button{font:inherit;cursor:pointer}
    .primary{width:100%;border:0;border-radius:10px;padding:13px 16px;background:var(--green);color:#06130d;font-weight:900;margin-top:4px}
    .primary:disabled{opacity:.65;cursor:wait}
    .secondary{width:100%;border:1px solid var(--border2);border-radius:10px;padding:11px 16px;background:transparent;color:var(--green2);font-weight:700;margin-top:10px}
    .links{display:flex;justify-content:space-between;gap:10px;margin-top:16px}.link{border:0;padding:0;background:none;color:var(--green2);font-size:13px}
    .message{display:none;padding:11px 13px;border-radius:9px;margin-bottom:16px;font-size:13px;line-height:1.45}.message.show{display:block}.error{background:rgba(255,133,133,.08);border:1px solid rgba(255,133,133,.25);color:#ffb0b0}.success{background:rgba(105,221,160,.08);border:1px solid rgba(105,221,160,.25);color:var(--green2)}
    .hidden{display:none!important}
  </style>
</head>
<body>
  <div class="shell">
    <div class="brand"><div class="mark">GA</div><h1>Goalie Analytics</h1><p>Goaltending Analytics Platform</p></div>
    <div class="card">
      <div id="loginView">
        <h2>Sign in</h2><p class="subtitle">Sign in to access your goalie analytics dashboard.</p>
        <div id="loginMessage" class="message"></div>
        <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Your password"></div>
        <button id="loginButton" class="primary" type="button">Sign In</button>
        <div class="links"><button id="signupLink" class="link" type="button">Create account</button><button id="forgotLink" class="link" type="button">Forgot password?</button></div>
      </div>
      <div id="signupView" class="hidden">
        <h2>Create account</h2><p class="subtitle">Create an account for a goalie analytics profile.</p>
        <div id="signupMessage" class="message"></div>
        <div class="field"><label for="name">Name</label><input id="name" type="text" placeholder="Full name"></div>
        <div class="field"><label for="signupEmail">Email</label><input id="signupEmail" type="email" autocomplete="email" placeholder="you@example.com"></div>
        <div class="field"><label for="signupPassword">Password</label><input id="signupPassword" type="password" autocomplete="new-password" placeholder="At least 6 characters"></div>
        <button id="signupButton" class="primary" type="button">Create Account</button><button id="backSignup" class="secondary" type="button">Back to Sign In</button>
      </div>
      <div id="forgotView" class="hidden">
        <h2>Reset password</h2><p class="subtitle">Enter your email and we'll send you a password reset link.</p>
        <div id="forgotMessage" class="message"></div>
        <div class="field"><label for="forgotEmail">Email</label><input id="forgotEmail" type="email" placeholder="you@example.com"></div>
        <button id="forgotButton" class="primary" type="button">Send Reset Link</button><button id="backForgot" class="secondary" type="button">Back to Sign In</button>
      </div>
    </div>
  </div>
<script>
const SUPABASE_URL="https://iiuqxxrrruvwvfehrzic.supabase.co";
const SUPABASE_KEY="sb_publishable_b8r2Nb1BWv4cndNyEJ75dA_o40__ZPQ";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
function message(id,text,type="error"){const el=$(id);el.textContent=text;el.className="message show "+type}
function clearMessages(){document.querySelectorAll('.message').forEach(e=>{e.className='message';e.textContent=''})}
function view(name){['loginView','signupView','forgotView'].forEach(id=>$(id).classList.add('hidden'));$(name).classList.remove('hidden');clearMessages()}
async function login(){
  const email=$('email').value.trim(),password=$('password').value;
  if(!email||!password){message('loginMessage','Please enter your email and password.');return}
  const b=$('loginButton');b.disabled=true;b.textContent='Signing in...';
  try{const {data,error}=await client.auth.signInWithPassword({email,password});if(error)throw error;if(data.user)window.location.href='/dashboard.html'}catch(e){message('loginMessage',e.message||'Unable to sign in.')}finally{b.disabled=false;b.textContent='Sign In'}
}
async function signup(){
  const name=$('name').value.trim(),email=$('signupEmail').value.trim(),password=$('signupPassword').value;
  if(!name||!email||!password){message('signupMessage','Please complete all fields.');return}if(password.length<6){message('signupMessage','Password must be at least 6 characters.');return}
  const b=$('signupButton');b.disabled=true;b.textContent='Creating...';
  try{const {data,error}=await client.auth.signUp({email,password,options:{data:{full_name:name}}});if(error)throw error;if(data.session){window.location.href='/dashboard.html'}else message('signupMessage','Account created. Check your email to confirm your account before signing in.','success')}catch(e){message('signupMessage',e.message||'Unable to create account.')}finally{b.disabled=false;b.textContent='Create Account'}
}
async function resetPassword(){const email=$('forgotEmail').value.trim();if(!email){message('forgotMessage','Please enter your email.');return}const b=$('forgotButton');b.disabled=true;b.textContent='Sending...';try{const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+'/dashboard.html'});if(error)throw error;message('forgotMessage','Password reset instructions have been sent to your email.','success')}catch(e){message('forgotMessage',e.message||'Unable to send reset link.')}finally{b.disabled=false;b.textContent='Send Reset Link'}}
$('loginButton').addEventListener('click',login);$('signupButton').addEventListener('click',signup);$('forgotButton').addEventListener('click',resetPassword);$('signupLink').addEventListener('click',()=>view('signupView'));$('forgotLink').addEventListener('click',()=>view('forgotView'));$('backSignup').addEventListener('click',()=>view('loginView'));$('backForgot').addEventListener('click',()=>view('loginView'));
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('email').addEventListener('keydown',e=>{if(e.key==='Enter')$('password').focus()});
client.auth.getSession().then(({data})=>{if(data.session)window.location.href='/dashboard.html'});
</script>
</body>
</html>
