<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Goalie Analytics Platform</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#061710;--card:#0c261c;--border:#1d4434;--text:#edf7f1;--muted:#88a599;--green:#69dda0;--green2:#9be1bd;--red:#ff8585}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0%,rgba(105,221,160,.1),transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}.shell{width:100%;max-width:430px}.brand{text-align:center;margin-bottom:28px}.mark{width:64px;height:64px;border-radius:18px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,var(--green),#3cae75);color:#04110b;font-size:26px;font-weight:900}.brand h1{margin:0;font-size:28px}.brand p{margin:8px 0 0;color:var(--muted);font-size:14px}.card{background:rgba(12,38,28,.95);border:1px solid var(--border);border-radius:20px;padding:28px}.card h2{margin:0 0 8px}.sub{margin:0 0 24px;color:var(--muted);font-size:14px}.field{margin-bottom:16px}.field label{display:block;margin-bottom:7px;font-size:13px;color:var(--green2);font-weight:700}.field input{width:100%;border:1px solid #285640;background:#071a12;color:var(--text);border-radius:10px;padding:12px 13px;outline:none}.button{width:100%;border:0;border-radius:10px;padding:13px 16px;background:var(--green);color:#06130d;font-weight:900}.msg{display:none;padding:11px 13px;border-radius:9px;margin-bottom:16px;font-size:13px}.msg.show{display:block}.error{background:rgba(255,133,133,.08);border:1px solid rgba(255,133,133,.25);color:#ffb0b0}.success{background:rgba(105,221,160,.08);border:1px solid rgba(105,221,160,.25);color:var(--green2)}.links{display:flex;justify-content:space-between;margin-top:16px}.link{border:0;background:none;color:var(--green2);font-size:13px;cursor:pointer}.loading{color:var(--muted);text-align:center}
</style>
</head>
<body>
<div id="auth" class="shell">
  <div class="brand"><div class="mark">GB</div><h1>Goalie Analytics</h1><p>Performance analytics platform</p></div>
  <div class="card">
    <h2>Sign In</h2><p class="sub">Sign in to access your goalie dashboard.</p>
    <div id="msg" class="msg"></div>
    <form id="form">
      <div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" required></div>
      <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button id="button" class="button" type="submit">Sign In</button>
    </form>
    <div class="links"><button class="link" id="reset" type="button">Forgot password?</button></div>
  </div>
</div>
<div id="loading" class="loading" style="display:none">Loading dashboard…</div>
<script>
const URL='https://iiuqxxrrruvwvfehrzic.supabase.co';
const KEY='sb_publishable_b8r2Nb1BWv4cndNyEJ75dA_o40__ZPQ';
const client=window.supabase.createClient(URL,KEY);
const auth=document.getElementById('auth'), loading=document.getElementById('loading'), msg=document.getElementById('msg');
function message(text,type='error'){msg.textContent=text;msg.className='msg show '+type}
async function openDashboard(){
  auth.style.display='none';loading.style.display='block';
  try{
    const r=await fetch('/dashboard.html?authfix=2',{cache:'no-store'});
    if(!r.ok) throw new Error('Dashboard file could not be loaded.');
    let html=await r.text();
    html=html.replace(/const\\s+\\{\\s*createClient\\s*\\}\\s*=\\s*window\\.supabase\\s*;/,'const { createClient } = window.supabase;');
    html=html.replace(/const\\s+supabase\\s*=\\s*createClient\\s*\\(/,'const dashboardSupabase = createClient(');
    html=html.replace(/\\bsupabase\\./g,'dashboardSupabase.');
    html=html.replace(/CURRENT_SEASON\\s*=\\s*["'][^"']*["']/,'CURRENT_SEASON = "2026 Pre-Season"');
    const blob=new Blob([html],{type:'text/html'});
    const frame=document.createElement('iframe');
    frame.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0;background:#061710';
    frame.setAttribute('title','Goalie Analytics Dashboard');
    frame.src=URL.createObjectURL(blob);
    document.body.innerHTML='';document.body.appendChild(frame);
  }catch(e){auth.style.display='block';loading.style.display='none';message(e.message||'Unable to load dashboard.')}
}
async function signIn(e){e.preventDefault();msg.className='msg';const button=document.getElementById('button');button.disabled=true;button.textContent='Signing In…';try{const {data,error}=await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;if(!data.session)throw new Error('Sign in completed, but no session was returned.');await openDashboard()}catch(e){message(e.message||'Unable to sign in.');button.disabled=false;button.textContent='Sign In'}}
async function resetPassword(){const email=document.getElementById('email').value.trim();if(!email){message('Enter your email address first.');return}const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:location.origin});if(error)message(error.message);else message('Password reset email sent.','success')}
document.getElementById('form').addEventListener('submit',signIn);document.getElementById('reset').addEventListener('click',resetPassword);
client.auth.getSession().then(({data})=>{if(data.session)openDashboard()});
</script>
</body>
</html>
