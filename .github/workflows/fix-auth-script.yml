name: Fix auth script

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-auth:
    if: ${{ !contains(github.event.head_commit.message, '[auth-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair auth JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # Make the Supabase client available to every script block.
          if 'window.supabaseClient = supabase;' not in s:
              pattern = r'(const\s+supabase\s*=\s*createClient\(\s*SUPABASE_URL,\s*SUPABASE_KEY\s*\);)'
              s, n = re.subn(pattern, r'\1\n\n    window.supabaseClient = supabase;', s, count=1)
              print('Global client patch:', n)

          # The login override is in a separate script tag, so it must use
          # the global client instead of the main script's local const.
          s, n = re.subn(
              r'(<!-- ROBUST_LOGIN_OVERRIDE -->\s*<script>\s*window\.login\s*=\s*async function login\(\)\{)\s*',
              r'\1\n      const supabase = window.supabaseClient;\n',
              s,
              count=1,
          )
          print('Login scope patch:', n)

          # Explicitly expose the main authenticated-user handler as well.
          if 'window.handleAuthenticatedUser = handleAuthenticatedUser;' not in s:
              marker = 'async function handleAuthenticatedUser(user){'
              if marker in s:
                  s = s.replace(marker, marker, 1)
                  close = '  }\n\n  async function loadProfile()'
                  if close in s:
                      s = s.replace(close, '  }\n\n  window.handleAuthenticatedUser = handleAuthenticatedUser;\n\n  async function loadProfile()', 1)

          if s == original:
              print('No changes made.')
          else:
              p.write_text(s, encoding='utf-8')
              print('Auth JavaScript repaired.')
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "[auth-fix] Repair login client scope"
            git push
          fi
