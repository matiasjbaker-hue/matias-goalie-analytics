name: Fix auth script

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-auth:
    if: ${{ !contains(github.event.head_commit.message, '[auth-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair auth JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # Repair any remaining nested script tags.
          s = s.replace(
              '<script>\n/* Prevent the initial getSession() check from racing with sign-in. */',
              '/* Prevent the initial getSession() check from racing with sign-in. */',
              1,
          )
          s = s.replace(
              '</script>\n\n\n<script>\nasync function safeInitializeAuth(){',
              '\n\nasync function safeInitializeAuth(){',
              1,
          )
          s = s.replace(
              '\n</script>\n\n    safeInitializeAuth();\n\n  </script>',
              '\n\n    safeInitializeAuth();\n\n  </script>',
              1,
          )

          # The robust login override lives in a later script tag, so the
          # locally-scoped Supabase client must also be exposed globally.
          old_client = '''    const supabase =
      createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );'''
          new_client = '''    const supabase =
      createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    window.supabaseClient = supabase;'''
          if old_client in s and 'window.supabaseClient = supabase;' not in s:
              s = s.replace(old_client, new_client, 1)

          old_login = '''  <script>
    window.login = async function login(){
      const emailEl = document.getElementById("loginEmail");'''
          new_login = '''  <script>
    window.login = async function login(){
      const supabase = window.supabaseClient;
      const emailEl = document.getElementById("loginEmail");'''
          if old_login in s and 'const supabase = window.supabaseClient;' not in s:
              s = s.replace(old_login, new_login, 1)

          if s == original:
              print('No changes made.')
          else:
              p.write_text(s, encoding='utf-8')
              print('Auth JavaScript repaired.')
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "[auth-fix] Expose Supabase client to login override"
            git push
          fi
