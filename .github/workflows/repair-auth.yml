name: Repair authentication

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install isolated login fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          marker = '<!-- ISOLATED_AUTH_FALLBACK -->'

          if marker in html:
              print('Fallback already installed')
              raise SystemExit(0)

          fallback = '''
<!-- ISOLATED_AUTH_FALLBACK -->
<script>
(function () {
  const SUPABASE_URL = 'https://iiuqxxrrruvwvfehrzic.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_b8r2Nb1BWv4cndNyEJ75dA_o40__ZPQ';

  function getClient() {
    if (window.__authSupabaseClient) return window.__authSupabaseClient;
    if (!window.supabase || typeof window.supabase.createClient !== 'function') {
      throw new Error('Authentication service did not load. Please refresh the page.');
    }
    window.__authSupabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    return window.__authSupabaseClient;
  }

  window.login = async function () {
    const emailEl = document.getElementById('loginEmail');
    const passwordEl = document.getElementById('loginPassword');
    const button = document.getElementById('loginButton');
    const message = document.getElementById('authMessage');
    const email = emailEl ? emailEl.value.trim() : '';
    const password = passwordEl ? passwordEl.value : '';

    if (!email || !password) {
      if (message) {
        message.textContent = 'Please enter your email and password.';
        message.className = 'auth-message show error';
      }
      return false;
    }

    if (button) {
      button.disabled = true;
      button.textContent = 'Signing in...';
    }

    try {
      const client = getClient();
      const result = await client.auth.signInWithPassword({ email, password });
      if (result.error) throw result.error;
      if (!result.data || !result.data.user) throw new Error('Sign in completed but no user was returned.');

      const authScreen = document.getElementById('authScreen');
      const app = document.getElementById('app');
      const badge = document.getElementById('userEmailBadge');
      if (authScreen) authScreen.classList.add('hidden');
      if (app) app.classList.remove('hidden');
      if (badge) badge.textContent = result.data.user.email || '';

      if (typeof window.handleAuthenticatedUser === 'function') {
        await window.handleAuthenticatedUser(result.data.user);
      }
    } catch (error) {
      if (message) {
        message.textContent = error && error.message ? error.message : 'Unable to sign in.';
        message.className = 'auth-message show error';
      }
    } finally {
      if (button) {
        button.disabled = false;
        button.textContent = 'Sign In';
      }
    }

    return false;
  };
})();
</script>
'''

          html = html.replace('</body>', fallback + '</body>', 1)
          path.write_text(html, encoding='utf-8')
          print('Installed isolated authentication fallback')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
          else
            git commit -m 'fix: isolate sign in handler'
            git push
          fi
