name: Fix sign-in handler

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-login:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair malformed login block
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          marker = "<!-- ROBUST_LOGIN_OVERRIDE -->"
          if marker not in text:
              print("Login marker not found; nothing to repair.")
              raise SystemExit(0)

          marker_pos = text.find(marker)
          script_start = text.rfind("<script", 0, marker_pos)
          script_end = text.find("</script>", marker_pos)

          if script_start == -1 or script_end == -1:
              raise SystemExit("Could not locate login override script.")

          script_end += len("</script>")
          block = text[script_start:script_end]

          # The previous patch accidentally stored literal backslash-n characters.
          # Convert those escape sequences into real newlines.
          repaired = block.replace("\\n", "\n")
          repaired = repaired.replace("\\\"", "\"")

          text = text[:script_start] + repaired + text[script_end:]
          path.write_text(text, encoding="utf-8")
          print("Repaired login block.")

      - name: Commit repaired index
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index changes needed."
            exit 0
          fi
          git commit -m "fix: convert malformed login script to valid javascript"
          git push
