name: Finalize authentication

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair authentication once
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # The page already has a working Supabase client in the main script.
          # Remove the duplicate login override, which was fighting the main auth code.
          s, n = re.subn(
              r'\s*<!-- ROBUST_LOGIN_OVERRIDE -->\s*<script>.*?</script>\s*',
              '\n',
              s,
              count=1,
              flags=re.S,
          )
          print('Removed duplicate login override:', n)

          # Expose the main functions explicitly for the inline onclick handlers.
          if 'window.login = login;' not in s:
              marker = '    /* =========================================================\n       START\n    ========================================================== */'
              if marker in s:
                  s = s.replace(
                      marker,
                      '    window.login = login;\n    window.handleAuthenticatedUser = handleAuthenticatedUser;\n    window.logout = logout;\n    window.signup = signup;\n    window.resetPassword = resetPassword;\n\n' + marker,
                      1,
                  )

          # Remove the old duplicate initialization wrappers and use the original initializer.
          s = re.sub(
              r'\n/\* Prevent the initial getSession\(\) check from racing with sign-in\. \*/.*?\n\s*safeInitializeAuth\(\);\s*\n',
              '\n    initializeAuth();\n',
              s,
              count=1,
              flags=re.S,
          )

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No authentication changes needed.'
          else
            git commit -m 'fix: remove duplicate authentication handlers'
            git push
          fi
