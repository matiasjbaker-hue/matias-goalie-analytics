name: One-time auth repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean up authentication architecture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text(encoding='utf-8')

          # Remove the temporary second-client login patch.
          t = t.replace('<script src="login-fix.js"></script>', '')

          # Replace the actual startup call with a clean startup function.
          safe_auth = r'''
          <script>
          async function safeInitializeAuth(){
            let sessionSeen = false;

            supabase.auth.onAuthStateChange((event, session) => {
              if (session && session.user) {
                sessionSeen = true;
                currentUser = session.user;
              } else if (event === "SIGNED_OUT") {
                currentUser = null;
                currentProfile = null;
                document.getElementById("app").classList.add("hidden");
                document.getElementById("authScreen").classList.remove("hidden");
                if (typeof showLogin === "function") showLogin();
              }
            });

            const { data, error } = await supabase.auth.getSession();
            if (error) {
              console.error("Auth session error:", error);
            }

            if (data && data.session) {
              currentUser = data.session.user;
              await handleAuthenticatedUser(data.session.user);
            } else if (!sessionSeen && !currentUser) {
              document.getElementById("authScreen").classList.remove("hidden");
              document.getElementById("app").classList.add("hidden");
            }
          }
          </script>
          '''

          if 'async function safeInitializeAuth()' not in t:
              t = t.replace('    initializeAuth();', safe_auth + '\n    safeInitializeAuth();', 1)
          else:
              t = t.replace('    initializeAuth();', '    safeInitializeAuth();', 1)

          p.write_text(t, encoding='utf-8')
          PY

          rm -f login-fix.js

      - name: Commit and remove repair workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html login-fix.js .github/workflows/fix-login.yml
          git commit -m 'fix: clean up auth session handling'
          git push