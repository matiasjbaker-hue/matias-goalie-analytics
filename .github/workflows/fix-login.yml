name: Repair login directly

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject login script
        run: python3 -c "from pathlib import Path; p=Path('index.html'); t=p.read_text(encoding='utf-8'); tag='<script src=\"login-fix.js\"></script>'; t=t.replace(tag,''); t=t.replace('</body>',tag+'\\n</body>',1); p.write_text(t,encoding='utf-8')"

      - name: Commit repaired index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: connect standalone sign-in handler'
          git push
