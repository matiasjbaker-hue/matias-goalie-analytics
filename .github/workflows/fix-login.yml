name: One-time auth cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean authentication code
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          t = p.read_text(encoding='utf-8')

          marker = '''    /* =========================================================
       START
    ========================================================== */'''

          if marker not in t:
              raise SystemExit('START marker not found')

          prefix = t.split(marker, 1)[0]

          clean_tail = r'''    /* =========================================================
       START
    ========================================================== */

    async function startAuth(){
      let handledUserId = null;
      let handling = false;

      const showLoggedOut = () => {
        currentUser = null;
        currentProfile = null;
        document.getElementById("app").classList.add("hidden");
        document.getElementById("authScreen").classList.remove("hidden");
        if (typeof showLogin === "function") showLogin();
      };

      supabase.auth.onAuthStateChange((event, session) => {
        if (session && session.user) {
          currentUser = session.user;
          return;
        }

        if (event === "SIGNED_OUT") {
          showLoggedOut();
        }
      });

      const { data, error } = await supabase.auth.getSession();

      if (error) {
        console.error("Supabase session error:", error);
        showLoggedOut();
        return;
      }

      if (data && data.session && data.session.user) {
        currentUser = data.session.user;
        handledUserId = data.session.user.id;
        await handleAuthenticatedUser(data.session.user);
      } else if (!currentUser) {
        showLoggedOut();
      }
    }

    startAuth();

  </script>
</body>
</html>
'''

          p.write_text(prefix + clean_tail, encoding='utf-8')
          PY

          rm -f login-fix.js

      - name: Commit cleanup and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html login-fix.js .github/workflows/fix-login.yml
          git commit -m 'fix: simplify Supabase authentication'
          git push
