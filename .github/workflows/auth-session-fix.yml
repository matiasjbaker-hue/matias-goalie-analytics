name: Fix auth session handoff

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch dashboard auth initialization
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('dashboard.html')
          s = p.read_text(encoding='utf-8')

          new = r'''    async function initializeAuth(){

      // Register the listener immediately so a session restored during
      // client initialization is not missed.
      supabase.auth.onAuthStateChange(
        async (event, session) => {
          if(session && session.user){
            currentUser = session.user;
            if(event === 'SIGNED_IN' || event === 'INITIAL_SESSION'){
              await handleAuthenticatedUser(session.user);
            }
          }
        }
      );

      // Supabase normally restores browser sessions from localStorage.
      // Give the client a moment to finish its automatic initialization.
      const { data, error } = await supabase.auth.getSession();

      if(error){
        console.error('Auth session error:', error);
      }

      if(data && data.session && data.session.user){
        await handleAuthenticatedUser(data.session.user);
        return;
      }

      document.getElementById('authScreen').classList.remove('hidden');
      document.getElementById('app').classList.add('hidden');
      showLogin();

    }


'''

          pattern = r'    async function initializeAuth\(\)\{.*?\n    async function handleAuthenticatedUser\(user\)\{'
          replacement = new + '    async function handleAuthenticatedUser(user){'
          patched, count = re.subn(pattern, replacement, s, count=1, flags=re.S)

          if count != 1:
              raise SystemExit('Could not find dashboard initializeAuth block')

          p.write_text(patched, encoding='utf-8')
          print('dashboard auth initialization patched')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix Supabase auth session handoff"
          git push
